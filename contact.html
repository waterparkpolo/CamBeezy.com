<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambeezy | Contact</title>
    <meta name="description" content="Contact and booking for Cambeezy." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">CamBeezy</a>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="music.html">Music</a>
          <a href="contact.html" aria-current="page">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <h1>Contact</h1>
          <p class="subtext">For booking, collabs, or business inquiries.</p>

          <div class="grid">
            <div class="card">
              <h2 class="h3">Quick Links</h2>
              <p><strong>Email:</strong> <a class="text-link" href="mailto:cambeezybeats@gmail.com">cambeezybeats@gmail.com</a></p>
              <p><strong>Instagram:</strong> <a class="text-link" href="https://www.instagram.com/cambeezy_/" target="_blank" rel="noreferrer">@cambeezy_</a></p>
              <p><strong>Twitter / X:</strong> <a class="text-link" href="https://x.com/cam_iw" target="_blank" rel="noreferrer">@cam_iw</a></p>
            </div>

            <form class="card form" action="mailto:cambeezybeats@gmail.com" method="post" enctype="text/plain">
              <h2 class="h3">Send a message</h2>

              <label>
                Name
                <input name="name" type="text" placeholder="Your name" required />
              </label>

              <label>
                Email
                <input name="email" type="email" placeholder="you@example.com" required />
              </label>

              <label>
                Message
                <textarea name="message" rows="5" placeholder="What's up?" required></textarea>
              </label>

              <button class="btn primary" type="submit">Send</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© <span id="year"></span> Cambeezy.</p>
      </div>
    </footer>

    <script src="assets/js/main.js"></script>
  </body>
</html>
