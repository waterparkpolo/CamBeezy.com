<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambeezy | Music</title>
    <meta name="description" content="Music and videos from Cambeezy." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">CamBeezy</a>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="music.html" aria-current="page">Music</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <h1>Music</h1>
          <p class="subtext">
            Latest releases, videos, and where to stream.
          </p>

          <div class="grid">
            <article class="card">
              <h2 class="h3">Featured Track</h2>
              <p>Check out the latest on Spotify.</p>
              <a class="btn primary" href="https://open.spotify.com/artist/3phIz6oDdkQlpb9kdahV9F" target="_blank" rel="noreferrer">Listen on Spotify</a>
            </article>

            <article class="card">
              <h2 class="h3">Featured Video</h2>
              <p>New videos drop on YouTube.</p>
              <a class="btn" href="https://www.youtube.com/@Cambeezy" target="_blank" rel="noreferrer">Watch on YouTube</a>
            </article>
          </div>

          <div class="card section-card">
            <h2 class="h3">Videos</h2>
            <div class="video-row">
              <iframe
                class="yt"
                src="https://www.youtube.com/embed/VYXe_ZeL_Kw?si=pojtDPjWou3A7oSF"
                title="Cambeezy - Luigi"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
              ></iframe>
              <iframe
                class="yt"
                src="https://www.youtube.com/embed/hA7DPnExc0U?si=SpBdrDfFz4A4Ssf1"
                title="Cambeezy - Weenie Hut Jr"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
              ></iframe>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© <span id="year"></span> Cambeezy.</p>
      </div>
    </footer>

    <script src="assets/js/main.js"></script>
  </body>
</html>
